[project]
name = "transform-cache-service"
version = "0.1.0"
description = "FastAPI service that builds payloads from transformed strings, caching transformer results."
readme = "README.md"
authors = [
    { name = "Yonas Mekonnen", email = "myonas886@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Short import name instead of the default derived from the distribution name.
module-name = "transform_cache"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run every `async def` test on an event loop without per-test markers.
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
